services:
  schiller:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET}
      HOUSEHOLD_PASSWORD: ${HOUSEHOLD_PASSWORD}
    networks:
      - schiller-network

  schiller-tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - schiller
    networks:
      - schiller-network

networks:
  schiller-network:
    driver: bridge
